# XcodeGen 설정. `xcodegen generate` 를 돌리면 InstaCat.xcodeproj 가 만들어집니다.
# Info.plist 와 entitlements 도 여기서 함께 생성되므로 직접 만들 필요가 없습니다.
name: InstaCat

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    # 아래 줄의 주석을 풀고 본인 Apple 개발자 팀 ID 를 넣으면 서명이 자동으로 잡힙니다.
    # DEVELOPMENT_TEAM: XXXXXXXXXX

# 확장(Extension) 타깃들이 공통으로 쓰는 설정
targetTemplates:
  Extension:
    type: app-extension
    platform: iOS
    settings:
      base:
        SKIP_INSTALL: YES
    entitlements:
      path: Generated/${target_name}.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.instacat

targets:

  InstaCat:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InstaCat
    info:
      path: Generated/InstaCat-Info.plist
      properties:
        CFBundleDisplayName: 인스타 고양이
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFamilyControlsUsageDescription: 인스타그램 사용 시간을 재고 제한하기 위해 스크린 타임 권한이 필요합니다.
    entitlements:
      path: Generated/InstaCat.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.example.instacat
    dependencies:
      - target: InstaCatMonitor
      - target: InstaCatShield
      - target: InstaCatShieldAction
      - target: InstaCatWidget

  InstaCatMonitor:
    templates: [Extension]
    sources:
      - path: Sources/Monitor
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InstaCat.Monitor
    info:
      path: Generated/InstaCatMonitor-Info.plist
      properties:
        CFBundleDisplayName: InstaCat Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension

  InstaCatShield:
    templates: [Extension]
    sources:
      - path: Sources/Shield
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InstaCat.Shield
    info:
      path: Generated/InstaCatShield-Info.plist
      properties:
        CFBundleDisplayName: InstaCat Shield
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  InstaCatShieldAction:
    templates: [Extension]
    sources:
      - path: Sources/ShieldAction
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InstaCat.ShieldAction
    info:
      path: Generated/InstaCatShieldAction-Info.plist
      properties:
        CFBundleDisplayName: InstaCat Shield Action
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

  InstaCatWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        SKIP_INSTALL: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.InstaCat.Widget
    info:
      path: Generated/InstaCatWidget-Info.plist
      properties:
        CFBundleDisplayName: 인스타 고양이
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/InstaCatWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.instacat
