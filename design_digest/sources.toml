# ---------------------------------------------------- 이미지 (인기순 게시물)
#
# 2026-08 기준 Reddit 은 GitHub Actions 같은 데이터센터 IP 의 공개 엔드포인트
# 요청을 403 Blocked 로 막는다. 그래서 기본값은 '꺼짐'이다.
#
# 되살리는 방법은 둘 중 하나:
#   1) https://www.reddit.com/prefs/apps 에서 script 앱을 만들고
#      REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET 를 넣는다 (README 3-1).
#      인증 코드는 이미 들어가 있어서 값만 넣으면 정식 API 로 붙는다.
#   2) 집 컴퓨터에서 돌린다. 개인 IP 는 대개 막히지 않는다.
# 둘 중 하나가 되면 아래 주석만 풀면 된다.

# [[reddit]]
# subreddit = "Design"
# min_score = 80
#
# [[reddit]]
# subreddit = "graphic_design"
# min_score = 150
#
# [[reddit]]
# subreddit = "web_design"
# min_score = 60
#
# [[reddit]]
# subreddit = "UI_Design"
# min_score = 40
#
# [[reddit]]
# subreddit = "typography"
# min_score = 60
#
# [[reddit]]
# subreddit = "industrialdesign"
# min_score = 80
#
# [[reddit]]
# subreddit = "InteriorDesign"
# min_score = 200
#
# [[reddit]]
# subreddit = "userexperience"
# min_score = 40
#
# --------------------------------------- 이미지 (공개 API 가 없는 사이트)
#
# 아래 네 곳은 공개 API 가 없거나 닫혀서, 사이트가 브라우저에 내려주는 데이터를
# 그대로 읽는다. 사이트 개편에 영향을 받으므로 `check` 로 상태를 확인하고,
# 깨지면 파이썬이 아니라 이 설정만 고치면 된다.
#   strategy = json | embedded_json | html | og
#   json_path / fields 를 비워두면 이미지가 든 배열을 스스로 찾는다.
# 상태 확인:  python -m design_digest check
# 구조 확인:  python -m design_digest debug --source Behance

# Behance 는 갤러리별로 주소가 나뉜다. 시각디자인 영역만 가져온다.
# link_template 은 항목에 주소 없이 id/slug 만 있을 때 작품 페이지 주소를 조립한다.
# (그게 없으면 리포트에서 제목을 눌렀을 때 이미지 파일만 열린다)
[[scrape]]
name = "Behance · 그래픽"
url = "https://www.behance.net/galleries/graphic-design"
base_url = "https://www.behance.net"
strategy = "embedded_json"
weight = 1.4
limit = 6
fields = { title = "name", link = "url", score = "stats.appreciations", published = "published_on" }
link_template = "https://www.behance.net/gallery/{id}/{slug}"

[[scrape]]
name = "Behance · 일러스트"
url = "https://www.behance.net/galleries/illustration"
base_url = "https://www.behance.net"
strategy = "embedded_json"
weight = 1.4
limit = 6
fields = { title = "name", link = "url", score = "stats.appreciations", published = "published_on" }
link_template = "https://www.behance.net/gallery/{id}/{slug}"

[[scrape]]
name = "Behance · 타이포"
url = "https://www.behance.net/galleries/typography"
base_url = "https://www.behance.net"
strategy = "embedded_json"
weight = 1.4
limit = 6
fields = { title = "name", link = "url", score = "stats.appreciations", published = "published_on" }
link_template = "https://www.behance.net/gallery/{id}/{slug}"

# Dribbble: 2026-08 확인 결과 자바스크립트 봇 검증 화면만 돌아온다
# ("we need to verify that you're not a robot"). 헤더로는 못 뚫는다.
# 개인 IP 에서는 통과하는 경우가 있으니 로컬 실행이라면 켜볼 것.
# RSSHub 를 띄웠다면 아래 [[feed]] 쪽 주석을 푸는 편이 확실하다.
[[scrape]]
name = "Dribbble"
url = "https://dribbble.com/shots/popular"
base_url = "https://dribbble.com"
strategy = "html"
link_pattern = "/shots/"
weight = 1.4
limit = 8
enabled = false

# 노트폴리오: 페이지는 자바스크립트로 그려져서 HTML 에 작업물이 없다.
# 대신 화면이 호출하는 API 를 직접 부른다 (PortfolioPick = 에디터 추천 작업).
# 원래 주소에는 cursor 파라미터가 붙어 있는데, 그건 특정 시점에 고정된
# 페이지 커서라 떼어냈다. 붙여두면 매일 같은 과거 목록만 온다.
[[scrape]]
name = "노트폴리오"
url = "https://api.stunning.kr/api/v1/dantats/curation/-/item?curationType=PortfolioPick&visible=Y&limit=20&orderBy=openDate"
base_url = "https://notefolio.net"
strategy = "json"
weight = 1.5
limit = 8

[[scrape]]
name = "월간디자인"
url = "https://mdesign.designhouse.co.kr/"
base_url = "https://mdesign.designhouse.co.kr"
strategy = "html"
link_pattern = "/article/"
weight = 1.3
limit = 6

# ------------------------------- 인스타그램 / 핀터레스트 (RSSHub 경유)
#
# 두 곳은 로그인 없이는 어떤 방법으로도 안정적으로 못 읽는다.
# RSSHub(https://docs.rsshub.app)를 직접 띄우면 RSS 로 바꿔서 받을 수 있다.
#
#   docker run -d -p 1200:1200 diygod/rsshub
#
# 띄운 뒤 아래 주석을 풀고 주소의 `localhost:1200` 과 계정/보드 이름을 바꾼다.
# `kind = "image"` 는 이 피드의 항목을 글이 아니라 작업물로 다루라는 뜻이다.
#
# [[feed]]
# name = "Instagram · 팔로우 중인 디자이너"
# url = "http://localhost:1200/instagram/user/원하는계정"
# kind = "image"
# weight = 1.5
#
# [[feed]]
# name = "Pinterest · 내 보드"
# url = "http://localhost:1200/pinterest/user/사용자명/보드이름"
# kind = "image"
# weight = 1.4
#
# 핀터레스트는 공개 보드라면 RSSHub 없이 바로 되는 경우도 있다.
# [[feed]]
# name = "Pinterest · 보드"
# url = "https://www.pinterest.com/사용자명/보드이름.rss"
# kind = "image"
# weight = 1.4

# ------------------------------------------------- 인기 신호 (언급량)
[hackernews]
enabled = true
queries = ["graphic design", "typography", "typeface", "illustration"]
min_points = 20
hits_per_query = 40

# ------------------------------------------------------ 관심 분야 좁히기
#
# 매체 하나가 여러 분야를 다루기 때문에, 소스 단위가 아니라 **글 단위**로 거른다.
# 제목에 include 단어가 있으면 통과, exclude 단어가 있으면 탈락.
# 제목만으로 판단이 안 되면 본문을 본다.
#
# 범위를 넓히고 싶으면 enabled = false 로 두거나 include 에 단어를 더하면 된다.
# 지금 무엇이 걸러지는지는 리포트 하단의 "관심 분야 밖" 건수로 확인할 수 있다.
[focus]
enabled = true

# 볼 분야를 그룹으로 고른다.
#   visual = 그래픽 · 타이포 · 폰트 · 일러스트 · 브랜딩 · 편집 · 패키지
#   ux     = UX · 인터랙션 · 디자인 시스템 · 리서치 · 방법론
# 시각디자인만 보고 싶으면 groups = ["visual"] 로 줄이면 된다.
# 소스를 지울 필요 없이 이 한 줄로 범위가 바뀐다.
groups = ["visual", "ux"]

# 그룹에 없는 단어를 더하고 싶을 때. (그룹과 합쳐진다)
# include = ["모션그래픽", "3d"]
# 배제어를 직접 지정하고 싶을 때. 적으면 기본 목록을 대체한다.
# exclude = ["architecture", "인테리어"]

# 이 소스의 글은 필터를 거치지 않는다 (이미 그 분야 전문지인 경우).
always_keep_sources = ["Typographica", "I Love Typography", "Brand New", "Creative Boom"]
