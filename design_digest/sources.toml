# 수집 소스 목록
#
# category 는 그 매체 글의 기본 성격이다. 실제 분류는 제목/본문 키워드로
# 다시 판정하고, 애매할 때만 이 값을 쓴다.
#   trend       = 최신 디자인 트렌드
#   methodology = 디자인 방법론 / 프로세스 / 리서치
#   philosophy  = 디자인 철학 / 관점 / 비평
#
# weight 는 랭킹 가중치(기본 1.0). 신뢰하는 매체를 조금 더 위로 올리고 싶을 때 조정.
# 링크가 죽었는지는 `python -m design_digest check` 로 확인할 수 있다.

