# --------------------------------------- 이미지 (공개 API 가 없는 사이트)
#
# 아래 네 곳은 공개 API 가 없거나 닫혀서, 사이트가 브라우저에 내려주는 데이터를
# 그대로 읽는다. 사이트 개편에 영향을 받으므로 `check` 로 상태를 확인하고,
# 깨지면 파이썬이 아니라 이 설정만 고치면 된다.
#   strategy = json | embedded_json | html | og
#   json_path / fields 를 비워두면 이미지가 든 배열을 스스로 찾는다.
# 상태 확인:  python -m design_digest check
# 구조 확인:  python -m design_digest debug --source Behance

[[scrape]]
name = "Behance"
url = "https://www.behance.net/galleries/graphic-design"
base_url = "https://www.behance.net"
strategy = "embedded_json"
weight = 1.4
limit = 8
fields = { title = "name", link = "url", score = "stats.appreciations", published = "published_on" }

[[scrape]]
name = "Dribbble"
url = "https://dribbble.com/shots/popular"
base_url = "https://dribbble.com"
strategy = "html"
link_pattern = "/shots/"
weight = 1.4
limit = 8

[[scrape]]
name = "노트폴리오"
url = "https://notefolio.net/discover"
base_url = "https://notefolio.net"
strategy = "embedded_json"
marker = "__NEXT_DATA__"
weight = 1.5
limit = 8

[[scrape]]
name = "월간디자인"
url = "https://mdesign.designhouse.co.kr/"
base_url = "https://mdesign.designhouse.co.kr"
strategy = "html"
link_pattern = "/article/"
weight = 1.3
limit = 6

# ------------------------------- 인스타그램 / 핀터레스트 (RSSHub 경유)
#
# 두 곳은 로그인 없이는 어떤 방법으로도 안정적으로 못 읽는다.
# RSSHub(https://docs.rsshub.app)를 직접 띄우면 RSS 로 바꿔서 받을 수 있다.
#
#   docker run -d -p 1200:1200 diygod/rsshub
#
# 띄운 뒤 아래 주석을 풀고 주소의 `localhost:1200` 과 계정/보드 이름을 바꾼다.
# `kind = "image"` 는 이 피드의 항목을 글이 아니라 작업물로 다루라는 뜻이다.
#
# [[feed]]
# name = "Instagram · 팔로우 중인 디자이너"
# url = "http://localhost:1200/instagram/user/원하는계정"
# kind = "image"
# weight = 1.5
#
# [[feed]]
# name = "Pinterest · 내 보드"
# url = "http://localhost:1200/pinterest/user/사용자명/보드이름"
# kind = "image"
# weight = 1.4
#
# 핀터레스트는 공개 보드라면 RSSHub 없이 바로 되는 경우도 있다.
# [[feed]]
# name = "Pinterest · 보드"
# url = "https://www.pinterest.com/사용자명/보드이름.rss"
# kind = "image"
# weight = 1.4

# ------------------------------------------------- 인기 신호 (언급량)
[hackernews]
enabled = true
queries = ["design", "typography", "user experience", "design system"]
min_points = 20
hits_per_query = 40
